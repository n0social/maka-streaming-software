<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:38473; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Maka</title>
    <meta name="theme-color" content="#faf8f4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <main class="panel">
      <header class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div>
          <p class="eyebrow">Maka</p>
          <h1>Relay</h1>
        </div>
      </header>

      <section class="status" aria-live="polite">
        <div class="light" id="light" data-state="stopped"></div>
        <div>
          <p class="label" id="lifecycle">Relay off</p>
          <p class="meta" id="meta">Waiting for local encoder…</p>
        </div>
      </section>

      <dl class="facts">
        <div>
          <dt>Health</dt>
          <dd id="health">—</dd>
        </div>
        <div>
          <dt>Stream</dt>
          <dd id="stream">—</dd>
        </div>
        <div>
          <dt>PID</dt>
          <dd id="pid">—</dd>
        </div>
      </dl>

      <p class="error" id="error" hidden></p>

      <div class="actions">
        <button type="button" class="primary" id="btn-start">Start relay</button>
        <button type="button" id="btn-stop">Stop</button>
      </div>
      <div class="actions">
        <button type="button" id="btn-stream">Open Stream</button>
        <button type="button" id="btn-home">Home</button>
      </div>

      <p class="hint">
        Capture stays in Chromium. This sidecar only encodes and pushes to Twitch /
        YouTube — the OBS-cost cut.
      </p>
    </main>
    <script type="module" src="./shell.ts"></script>
  </body>
</html>
