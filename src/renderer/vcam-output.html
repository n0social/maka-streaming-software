<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:; connect-src 'self'"
    />
    <title>Maka Virtual Camera</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      p {
        margin: 0;
        color: #faf8f4;
        font: 14px system-ui, sans-serif;
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <p id="vcam-waiting">Waiting for program frames…</p>
    <img id="vcam-frame" alt="Maka virtual camera output" hidden />
    <script type="module" src="./vcam-output.ts"></script>
  </body>
</html>
