name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Cache relay binary
        id: relay-cache
        uses: actions/cache@v4
        with:
          path: vendor/relay
          key: relay-v1-${{ hashFiles('vendor/relay/relay-manifest.json') }}

      - name: Fetch relay binary
        if: steps.relay-cache.outputs.cache-hit != 'true'
        run: npm run fetch:relay

      - name: Verify (offline)
        run: npm run verify:offline

      - name: Verify addons
        run: npm run verify:addons
