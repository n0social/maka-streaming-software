name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify site SEO
        run: npm run verify:site-seo

      - name: Encode adapt tests
        run: npm run test:encode-adapt

      - name: Encode backpressure tests
        run: npm run test:encode-backpressure

      - name: Open relay smoke tests
        run: MAKA_RELAY_MOCK_RTMP=1 npm run test:web-relay

      - name: Platform metadata tests
        run: npm run test:platform-metadata

      - name: Platform viewer tests
        run: npm run test:platform-viewers

      - name: Relay live stats tests
        run: npm run test:relay-live-stats

      - name: QoS score tests
        run: npm run test:qos-score

      - name: Retired addon catalog tests
        run: npm run test:retired-addons

      - name: Game audio source tests
        run: npm run test:game-audio-source

      - name: QoS log and live retry tests
        run: npm run test:qos-log && npm run test:live-retry && npm run test:capture-health && npm run test:capture-fallback

      - name: Build
        run: npm run build

      - name: Prepare open relay bundle
        run: npm run prepare:relay

      - name: Verify (offline)
        run: npm run verify:offline

      - name: Verify addons
        run: npm run verify:addons
