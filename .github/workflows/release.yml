name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch relay binary
        run: npm run fetch:relay

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          TABCAST_SIGNING_REQUIRED: ${{ secrets.CSC_LINK && '1' || '' }}
          TABCAST_PUBLISH: ${{ contains(github.ref_name, 'wip') && '' || '1' }}
        run: npm run dist:signed

      - name: Update browser manifest
        run: npm run release:manifest

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ contains(github.ref_name, 'wip') }}
          files: |
            dist-installer/*
            site/browser-manifest.json
          generate_release_notes: true
