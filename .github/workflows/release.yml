name: Release

on:
  push:
    tags:
      - 'v*'
      - 'maka.streaming.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and attach to its GitHub Release
        required: true
        default: maka.streaming.v.01

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch relay binary
        run: npm run fetch:relay

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          TABCAST_SIGNING_REQUIRED: ${{ secrets.CSC_LINK && '1' || '' }}
          TABCAST_PUBLISH: '1'
        run: npm run dist:signed

      - name: Update browser manifest
        run: npm run release:manifest

      - name: Resolve release tag name
        id: rel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Render release notes from template
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -e "s/{{tag_name}}/${{ steps.rel.outputs.name }}/g" \
              -e "s/{{version}}/${VERSION}/g" \
              .github/RELEASE_NOTES_TEMPLATE.md > release-notes.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Maka ${{ steps.rel.outputs.name }} — Windows streaming software
          tag_name: ${{ steps.rel.outputs.name }}
          draft: ${{ contains(steps.rel.outputs.name, 'wip') }}
          files: |
            dist-installer/*
            site/browser-manifest.json
          body_path: release-notes.md
          generate_release_notes: true
