name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: true
        default: main
      upload_release:
        description: Create/update a draft GitHub Release for this ref
        type: boolean
        default: false
      tag_name:
        description: Release tag (when upload_release is true), e.g. maka.streaming.v0.2.7
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache relay binary
        id: relay-cache
        uses: actions/cache@v4
        with:
          path: vendor/relay
          key: relay-v1-${{ hashFiles('vendor/relay/relay-manifest.json') }}

      - name: Fetch relay binary
        if: steps.relay-cache.outputs.cache-hit != 'true'
        run: npm run fetch:relay

      - name: Build installer (unsigned when CSC_* unset)
        env:
          MAKA_SKIP_PUBLISH: '1'
        run: node scripts/dist-signed.mjs

      - name: Update download manifest
        run: node scripts/update-browser-manifest.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maka-installer-${{ github.run_number }}
          path: |
            dist-installer/Maka-Setup-*.exe
            dist-installer/*.blockmap
            dist-installer/latest.yml
            site/browser-manifest.json
          if-no-files-found: error

      - name: Draft GitHub Release
        if: inputs.upload_release == true && inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Maka ${{ inputs.tag_name }}
          draft: true
          files: |
            dist-installer/Maka-Setup-*.exe
            dist-installer/*.blockmap
            dist-installer/latest.yml
            site/browser-manifest.json
          generate_release_notes: true
