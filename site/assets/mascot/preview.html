<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Maka mascot preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3rem;
        background: #faf8f4;
        font-family: system-ui, sans-serif;
        color: #2a2418;
      }
      figure {
        margin: 0;
        text-align: center;
      }
      figcaption {
        margin-top: 0.75rem;
        font-size: 14px;
        font-weight: 600;
      }
      .hero img {
        width: 256px;
        height: 256px;
        filter: drop-shadow(0 8px 24px rgba(201, 162, 39, 0.35));
      }
      .favicon img {
        width: 48px;
        height: 48px;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <figure class="hero">
      <img src="maka-mascot.svg" alt="Maka mascot hero" />
      <figcaption>256px hero</figcaption>
    </figure>
    <figure class="favicon">
      <img src="maka-mascot.svg" alt="Maka mascot favicon scale" />
      <figcaption>48px corner</figcaption>
    </figure>
  </body>
</html>
