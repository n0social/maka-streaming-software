# Example only — apply on skydav AFTER makalive.stream points at the new droplet.
# Prefer root /opt/maka-funnel so /opt/maka/web stays as an untouched backup.

server {
    server_name tabcast.live.skydav.work;
    # Do NOT list makalive.stream here once apex DNS is on the new droplet.

    root /opt/maka-funnel;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep existing Certbot SSL lines for tabcast.live.skydav.work
    # listen 443 ssl;
    # ssl_certificate ...
}
