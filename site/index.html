      rel="stylesheet"
    />
    <style>
      /* Critical home MVP — keeps cream/gold hero readable if external maka.css fails (Caddy path-stripping, cache) */
      :root {
        color-scheme: light;
        --gold: #ffc40c;
        --gold-light: #ffd633;
        --gold-dark: #c99800;
        --champagne: #f6f3ec;
        --bg: #faf8f4;
        --panel: #ffffff;
        --line: #e6dfd0;
        --text: #1a1408;
        --muted: #6b6256;
        --headline: "League Spartan", system-ui, sans-serif;
        --body: "Inter", "Segoe UI", system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: var(--body);
        color: var(--text);
        background: var(--bg);
      }
      .page-home-mvp {
        background-color: var(--bg);
      }
      .site-shell--mvp {
        max-width: min(62rem, 100%);
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 1.5rem 1.25rem 2rem;
      }
      .hero-mvp {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hero-mvp__inner {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        width: 100%;
      }
      /* Wordmark — must stay readable if maka.css fails (origin serves inline first) */
      .hero-mvp__brand-stage {
        display: grid;
        place-items: center;
        width: 100vw;
        max-width: 100vw;
        margin-left: calc(50% - 50vw);
        margin-right: calc(50% - 50vw);
      }
      .maka-wordmark {
        position: relative;
        grid-area: 1 / 1;
        justify-self: center;
        margin: 0;
        font-family: var(--headline);
        font-weight: 900;
        font-style: italic;
        font-size: clamp(3.5rem, 16vw, 9rem);
        line-height: 0.9;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        width: fit-content;
        text-align: center;
      }
      .maka-wordmark__svg {
        display: block;
        width: min(86vw, 46rem);
        height: auto;
        margin: 0 auto;
        overflow: visible;
      }
      .maka-wordmark__svg text {
        font-family: var(--headline);
        font-weight: 900;
        font-style: italic;
        font-size: 188px;
      }
      .maka-svg-back {
        fill: #ffffff;
      }
      .maka-svg-yellow {
        fill: #ffc40c;
      }
      .maka-svg-foil {
        fill: #f6f3ec;
      }
      .hero-mvp__actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.65rem;
        max-width: 36rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.85rem 1.1rem;
        border-radius: 999px;
        font-family: var(--headline);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        border: 1px solid transparent;
      }
      .btn-outline {
        background: var(--panel);
        border-color: rgba(255, 196, 12, 0.35);
        color: var(--text);
      }
      .btn-primary {
        background: linear-gradient(100deg, var(--gold-light), var(--gold));
        color: var(--text);
      }
      .site-footer--center {
        text-align: center;
        color: var(--muted);
        font-size: 0.78rem;
      }
    </style>
    <link rel="preload" as="style" href="/maka.css?v=dc6d038" />
    <link rel="stylesheet" href="/maka.css?v=dc6d038" />
    <link
      rel="stylesheet"
      href="https://tabcast.live.skydav.work/maka.css?v=dc6d038"

  </head>
  <body class="page-home-mvp">
    <div class="site-shell site-shell--mvp">
      <main class="hero-mvp">
        <div class="hero-mvp__backdrop" aria-hidden="true">
          <span class="hero-mvp__orb hero-mvp__orb--1"></span>
          <span class="hero-mvp__orb hero-mvp__orb--2"></span>
          <span class="hero-mvp__grid"></span>
        </div>

        <div class="hero-mvp__inner">
          <div class="hero-mvp__brand-stage">
            <div class="hero-mvp__mascot-wrap" aria-hidden="true">
              <img
                class="hero-mvp__mascot"
                src="/assets/mascot/maka-mascot.png"
                alt=""
                width="1024"
                height="1024"
                decoding="async"
                fetchpriority="high"
              />
            </div>
            <h1 class="maka-wordmark" aria-label="MAKA">
              <svg class="maka-wordmark__svg" viewBox="0 0 1000 280" role="img" aria-hidden="true">
                <defs>
                  <clipPath id="maka-yellow-half" clipPathUnits="objectBoundingBox">
                    <polygon points="0,0.56 1,0.18 1,1.2 0,1.2" />
                  </clipPath>
                  <clipPath id="maka-foil-half" clipPathUnits="objectBoundingBox">
                    <polygon points="0,-0.2 1,-0.2 1,0.18 0,0.56" />
                  </clipPath>
                  <linearGradient id="maka-foil" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0.45">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="18%" stop-color="#c8f3ff" />
                    <stop offset="40%" stop-color="#ffd6f2" />
                    <stop offset="62%" stop-color="#fff3b0" />
                    <stop offset="82%" stop-color="#e7fff6" />
                    <stop offset="100%" stop-color="#ffffff" />
                  </linearGradient>
                  <linearGradient id="maka-shine" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0.55">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                    <stop offset="16%" stop-color="#ffffff" stop-opacity="0.25" />
                    <stop offset="34%" stop-color="#ffffff" stop-opacity="1" />
                    <stop offset="48%" stop-color="#fff6d0" stop-opacity="0.35" />
                    <stop offset="64%" stop-color="#ffffff" stop-opacity="0.95" />
                    <stop offset="80%" stop-color="#ffffff" stop-opacity="0.3" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85" />
                  </linearGradient>
                </defs>
                <text class="maka-svg-back" x="512" y="214" text-anchor="middle">MAKA</text>
                <text class="maka-svg-yellow" x="500" y="202" text-anchor="middle" clip-path="url(#maka-yellow-half)">MAKA</text>
                <text class="maka-svg-foil" x="500" y="202" text-anchor="middle" clip-path="url(#maka-foil-half)">MAKA</text>
                <text class="maka-svg-shine" x="500" y="202" text-anchor="middle" clip-path="url(#maka-foil-half)">MAKA</text>
              </svg>
            </h1>
          </div>

          <nav class="hero-mvp__actions" aria-label="Primary actions">
            <a class="btn btn-outline hero-mvp__btn" href="/stream/"><span>Stream</span></a>
            <a class="btn btn-outline hero-mvp__btn" href="/preview/"><span>App preview</span></a>
            <a
              class="btn btn-primary hero-mvp__btn hero-mvp__btn--download"
              href="https://github.com/n0social/maka-streaming-software/releases/download/maka.streaming.v.01/Maka-Setup-0.2.4.exe"
              ><span>Download</span></a
            >
          </nav>
        </div>
      </main>

      <footer class="site-footer site-footer--center">MAKA · MIT</footer>
    </div>
  </body>
</html>
