# Public site: https://makalive.stream
# The previous origin hostname stays in server_name so existing links keep resolving.
server {
    server_name tabcast.live.skydav.work makalive.stream www.makalive.stream;

    root /opt/maka/web;
    include /etc/nginx/snippets/maka-downloads.conf;
    include /etc/nginx/snippets/maka-site-cache.conf;
    index index.html;

    error_page 404 /404.html;
    error_page 500 502 503 504 /404.html;

    location = /404.html {
        root /opt/maka/web;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_intercept_errors on;
    }

    location ~ ^/(auth|rooms|admin|billing|webhooks|health) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tabcast.live.skydav.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tabcast.live.skydav.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = tabcast.live.skydav.work) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = makalive.stream) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = www.makalive.stream) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name tabcast.live.skydav.work makalive.stream www.makalive.stream;
    return 404; # managed by Certbot
}
