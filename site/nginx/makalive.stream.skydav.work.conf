# Public site: https://makalive.stream (+ origin makalive.stream.skydav.work)
# TLS files still live under the original Let's Encrypt lineage path on this droplet.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name makalive.stream.skydav.work makalive.stream www.makalive.stream;

    root /opt/maka/web;
    include /etc/nginx/snippets/maka-downloads.conf;
    include /etc/nginx/snippets/maka-site-cache.conf;
    index index.html;

    error_page 404 /404.html;
    error_page 500 502 503 504 /404.html;

    location = /404.html {
        root /opt/maka/web;
    }

    # Local MAKA relay (scripts/web-relay-dev.mjs or sidecar on 127.0.0.1:38473)
    location /relay/ {
        proxy_pass http://127.0.0.1:38473/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        client_max_body_size 2m;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_intercept_errors on;
    }

    location ~ ^/(auth|rooms|admin|billing|webhooks|health) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Studio is private. Password file lives only on the droplet.
    location = /stream {
        auth_basic "Maka stream";
        auth_basic_user_file /etc/nginx/maka-stream.htpasswd;
        return 301 /stream/;
    }

    location /stream/ {
        auth_basic "Maka stream";
        auth_basic_user_file /etc/nginx/maka-stream.htpasswd;
        try_files $uri $uri/ /stream/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/tabcast.live.skydav.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabcast.live.skydav.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name makalive.stream.skydav.work makalive.stream www.makalive.stream;
    return 301 https://$host$request_uri;
}
