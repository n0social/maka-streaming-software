# Legacy apex hostname → makalive.stream (301). Cert path matches the old LE lineage.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tabcast.live.skydav.work;
    ssl_certificate /etc/letsencrypt/live/tabcast.live.skydav.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabcast.live.skydav.work/privkey.pem;
    return 301 https://makalive.stream$request_uri;
}
