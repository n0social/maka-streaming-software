    <script id="tabcast-boot-timeout">
      (function () {
        var BOOT_MS = 12000;
        window.setTimeout(function () {
          var root = document.getElementById("root");
          var placeholder = document.getElementById("tabcast-boot-placeholder");
          if (!placeholder || !root || !root.contains(placeholder)) return;
          if (root.childElementCount > 1) return;
          window.location.replace("/404.html?reason=boot");
        }, BOOT_MS);
      })();
