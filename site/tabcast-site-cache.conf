# Optional nginx snippet — HTML + main stylesheet freshness (query ?v= on maka.css is primary cache bust).
# Include inside the tabcast.live server block, before generic static locations:
#   include /etc/nginx/snippets/tabcast-site-cache.conf;
#
# Does not affect /marketing/* or other long-cache assets.

location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /maka.css {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
