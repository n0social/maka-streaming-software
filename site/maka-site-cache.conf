# Maka HTML + main stylesheet — never fall through to SPA index.html for /maka.css.
# Included from site/nginx/makalive.stream.skydav.work.conf

location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /maka.css {
    default_type text/css;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

location ~ ^/maka\.css$ {
    default_type text/css;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
