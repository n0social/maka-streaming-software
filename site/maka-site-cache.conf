# Maka HTML + main stylesheet — never fall through to SPA index.html for /maka.css.
# Included from site/nginx/tabcast.live.skydav.work.conf (deploy-site.sh copies both).

location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

location ~ ^/maka\.css {
    types { }
    default_type text/css;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    try_files /maka.css =404;
}

location = /stream/index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

location ~ ^/stream/stream\.(css|js)$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}
