# Maka downloads — PE binaries with attachment headers.
# Deploy to: /etc/nginx/snippets/maka-downloads.conf

# Legacy installer and encoder URLs — keep old bookmarks working.
location = /downloads/TabcastBrowser-0.2.0.exe {
    return 302 /downloads/Maka-Setup-0.2.6.exe;
}

location = /downloads/TabcastBrowser-Setup-0.2.0.exe {
    return 302 /downloads/Maka-Setup-0.2.6.exe;
}

location = /downloads/Maka-Setup-0.2.4.exe {
    return 302 /downloads/Maka-Setup-0.2.6.exe;
}

location = /downloads/Maka-Setup-0.2.5.exe {
    return 302 /downloads/Maka-Setup-0.2.6.exe;
}

location = /downloads/TabcastRelay.exe {
    return 302 /downloads/MAKArelay.exe;
}

location = /downloads/MAKArelay.exe {
    types { }
    default_type application/vnd.microsoft.portable-executable;
    add_header Content-Disposition 'attachment; filename="MAKArelay.exe"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600" always;
    gzip off;
    try_files $uri =404;
}

location = /downloads/Maka-Setup-0.2.6.exe {
    types { }
    default_type application/vnd.microsoft.portable-executable;
    add_header Content-Disposition 'attachment; filename="Maka-Setup-0.2.6.exe"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600" always;
    gzip off;
    try_files $uri =404;
}

location = /downloads/relay-manifest.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    gzip off;
    try_files $uri =404;
}

location = /downloads/browser-manifest.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    gzip off;
    try_files $uri =404;
}

# Temporary 2026-10-29 skydav backup mirror (remove after user confirms Drive upload).
location ^~ /downloads/backup/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, no-store" always;
    gzip off;
    try_files $uri =404;
}

location = /downloads/backup/maka-skydav-backup-2026-10-29-photos-and-site.tar.gz {
    types { }
    default_type application/gzip;
    add_header Content-Disposition 'attachment; filename="maka-skydav-backup-2026-10-29-photos-and-site.tar.gz"' always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, no-store" always;
    gzip off;
    try_files $uri =404;
}
