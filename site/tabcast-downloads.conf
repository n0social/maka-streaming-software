# Tabcast downloads — PE binaries with attachment headers.
# Deploy to: /etc/nginx/snippets/tabcast-downloads.conf

# Legacy Tabcast Browser installer URLs (pre-Maka rename) — keep bookmarks working.
location = /downloads/TabcastBrowser-0.2.0.exe {
    return 302 /downloads/Maka-Setup-0.2.5.exe;
}

location = /downloads/TabcastBrowser-Setup-0.2.0.exe {
    return 302 /downloads/Maka-Setup-0.2.5.exe;
}

location = /downloads/Maka-Setup-0.2.4.exe {
    return 302 /downloads/Maka-Setup-0.2.5.exe;
}

location = /downloads/TabcastRelay.exe {
    return 302 /downloads/MAKArelay.exe;
}

location = /downloads/MAKArelay.exe {
    types { }
    default_type application/vnd.microsoft.portable-executable;
    add_header Content-Disposition 'attachment; filename="MAKArelay.exe"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600" always;
    gzip off;
    try_files $uri =404;
}

location = /downloads/Maka-Setup-0.2.5.exe {
    types { }
    default_type application/vnd.microsoft.portable-executable;
    add_header Content-Disposition 'attachment; filename="Maka-Setup-0.2.5.exe"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600" always;
    gzip off;
    try_files $uri =404;
}

location = /downloads/relay-manifest.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    gzip off;
    try_files $uri =404;
}

location = /downloads/browser-manifest.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    gzip off;
    try_files $uri =404;
}
