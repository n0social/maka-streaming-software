# Tabcast downloads — PE binaries with attachment headers.
# Deploy to: /etc/nginx/snippets/tabcast-downloads.conf

location = /downloads/TabcastRelay.exe {
    types { }
    default_type application/vnd.microsoft.portable-executable;
    add_header Content-Disposition 'attachment; filename="TabcastRelay.exe"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600" always;
    gzip off;
    try_files $uri =404;
}

location = /downloads/TabcastBrowser-Setup-0.2.0.exe {
    types { }
    default_type application/vnd.microsoft.portable-executable;
    add_header Content-Disposition 'attachment; filename="TabcastBrowser-Setup-0.2.0.exe"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600" always;
    gzip off;
    try_files $uri =404;
}

location = /downloads/relay-manifest.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    gzip off;
    try_files $uri =404;
}

location = /downloads/browser-manifest.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    gzip off;
    try_files $uri =404;
}
